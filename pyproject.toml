[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustedrag"
version = "0.1.0"
description = "Trusted document RAG with automatic routing, evidence visualization, and serial knowledge-base builds"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "python-multipart==0.0.32",
  "pydantic==2.13.4",
  "openai==2.54.0",
  "lightrag-hku==1.4.16",
  "pypdf==6.16.1",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "pypptx-with-oxml==1.0.3",
  "reportlab==5.0.0",
  "Pillow==12.3.0",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["raganything*", "webapp*"]

[tool.pytest.ini_options]
testpaths = ["webapp/tests"]
python_files = ["test*.py"]
norecursedirs = ["frontend", "data", ".venv", "node_modules"]

[tool.ruff]
target-version = "py311"
